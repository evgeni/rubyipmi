# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: rubygem-rubyipmi.spec

# add or remove files that should be synced
files_to_sync:
    - rubygem-rubyipmi.spec
    - .packit.yaml

# name in upstream package repository or registry (e.g. in PyPI)
upstream_package_name: rubyipmi
# downstream (Fedora) RPM package name
downstream_package_name: rubygem-rubyipmi

upstream_tag_template: v{version}

actions:
  post-upstream-clone:
    - "wget https://raw.githubusercontent.com/theforeman/foreman-packaging/rpm/develop/packages/foreman/rubygem-rubyipmi/rubygem-rubyipmi.spec -O rubygem-rubyipmi.spec"
  get-current-version:
    - ruby -rrubygems -e 'puts Gem::Specification::load(Dir.glob("*.gemspec").first).version'
  create-archive:
    - gem build rubyipmi.gemspec
    - bash -c "ls -1t ./rubyipmi-*.gem | head -n 1"

jobs:
  - &copr
    job: copr_build
    trigger: pull_request
    targets:
      - rhel-9

srpm_build_deps:
  - wget
  - rubygems
